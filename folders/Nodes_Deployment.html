<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chenglong Duan's Nodes Deployment, Rice Campus." />
  <meta name="robots" content="index, follow" />
  <title>Nodes Deployment | Gallery</title>
  <link rel="icon" href="../images/favicon.ico" type="image/x-icon" />
  <link rel="icon" href="../images/favicon.png" type="image/png" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #535454;
      margin: 0;
      color: #d1d1d1;
    }

    .navbar {
      background-color: #026aa6;
      display: flex;
      justify-content: center;
      padding: 14px 0;
    }

    .navbar a {
      color: #fafbfc;
      padding: 14px 20px;
      text-decoration: none;
      font-weight: bold;
    }

    .navbar a:hover,
    .navbar a.active {
      background-color: #048ddb;
    }

    .intro-text {
     font-size: 18px;
     text-align: left; 
     max-width: 900px;
     margin: 40px auto 20px auto;
     padding: 0 20px;
     line-height: 1.6;
     color: #d1d1d1; 
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
      padding: 40px 20px;
      max-width: 1000px;
      margin: 0 auto;
     align-items: start;
    }

    /* Individual photos */
    .photo-box {
     text-align: center;
     max-width: 400px;
     width: 100%;
     margin: 0 auto;
    }

    /* Featured photo - first row */
    .photo-box.featured {
     grid-column: 1 / -1;
     max-width: 900px;
     width: 100%;
     margin: 0 auto;
    }

    .photo-box img {
     width: 100%;
     height: auto;
     display: block;
     border-radius: 6px;
    }

    .caption {
      margin-top: 8px;
      font-size: 18px;
      line-height: 1.8;
      text-align: left;
      padding: 0;
      max-width: 100%;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .photo-box.featured {
       grid-column: auto;
       max-width: 100%;
       }
 }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="../gallery.html">← Back to Albums</a>
  </div>

  <div class="intro-text">
     In November 2026, I helped guide students from the Seismology I course through the deployment of seismic nodes around KWGL building on Rice University campus, providing hands-on instruction and field experience in seismic data acquisition.
   </div>

  <div class="gallery-grid">

    <div class="photo-box featured">
      <img src="../images/Nodes_Deployment/Photo1.jpg" alt="Photo1">
      
    </div>

    <div class="photo-box">
      <img src="../images/Nodes_Deployment/Photo2.jpg" alt="Photo2">
     
    </div>

    <div class="photo-box">
      <img src="../images/Nodes_Deployment/Photo3.jpg" alt="Photo3">
     
    </div>

      

  </div>

</body>
</html>
