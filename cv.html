<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dr. Chenglong Duan's Curriculum Vitae (CV)" />
  <meta name="robots" content="index, follow" />

  <title>Chenglong Duan – Curriculum Vitae | Seismology</title>

  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  <link rel="icon" href="images/favicon.png" type="image/png" />

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #535454;
      color: #fafbfc;
    }

    /* Banner */
    .banner {
      width: 100%;
      height: 250px;
      background: url('images/banner.jpg') no-repeat center center;
      background-size: cover;
    }

    @media (max-width: 768px) {
      .banner {
        height: 120px;
        background-position: center top;
        background-size: cover;
      }
    }

    /* Navigation Bar */
    .navbar {
      background-color: #026aa6;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    .navbar a {
      color: #fafbfc;
      text-align: center;
      padding: 14px 20px;
      text-decoration: none;
      font-weight: bold;
    }

    .navbar a:hover {
      background-color: #048ddb;
    }

    .navbar a.active {
      background-color: #048ddb;
      color: #fcfcfc;
    }

    @media (max-width: 768px) {
      .navbar a {
        padding: 10px 12px;
        font-size: 14px;
      }
    }

    /* Main Container */
    .container {
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    /* CV Image Viewer */
    .image-viewer {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .image-viewer img {
      width: 100%;
      margin-bottom: 20px;

      border: none;
      box-shadow: none;
      border-radius: 0;

      display: block;
    }

    /* Mobile Optimization */
    @media (max-width: 768px) {

      .container {
        padding: 0;
        align-items: stretch;
      }

      .image-viewer {
        max-width: 100%;
      }

      .image-viewer img {
        width: 100vw;
        max-width: 100vw;
        margin-bottom: 0;
      }
    }

    /* Download Button */
    .download-link {
      position: fixed;
      bottom: 20px;
      right: 30px;

      background-color: #026aa6;
      color: white;

      padding: 10px 15px;

      text-decoration: none;
      border-radius: 5px;

      font-size: 14px;

      z-index: 1000;
    }

    .download-link:hover {
      background-color: #048ddb;
    }

  </style>
</head>

<body>

  <!-- Banner -->
  <div class="banner"></div>

  <!-- Navigation Bar -->
  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="cv.html" class="active">CV</a>
    <a href="research.html">Research</a>
    <a href="publications.html">Publications</a>
    <a href="news.html">News</a>
    <a href="gallery.html">Gallery</a>
    <a href="contacts.html">Contacts</a>
  </div>

  <!-- CV Images -->
  <div class="container image-viewer">

    <img src="images/cv-page1.jpg" alt="CV Page 1" />

    <img src="images/cv-page2.jpg" alt="CV Page 2" />

    <img src="images/cv-page3.jpg" alt="CV Page 3" />

    <img src="images/cv-page4.jpg" alt="CV Page 4" />

    <img src="images/cv-page5.jpg" alt="CV Page 5" />

  </div>

  <!-- PDF Download Button -->
  <a class="download-link" href="my-cv.pdf" download>
    Download CV as PDF
  </a>

</body>
</html>
